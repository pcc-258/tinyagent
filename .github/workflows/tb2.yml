name: TB2

on:
  workflow_call:
    inputs:
      automatic:
        type: boolean
        default: true
    secrets:
      TINYAGENT_API_KEY:
        required: false
      TINYAGENT_BASE_URL:
        required: false
      TINYAGENT_MODEL:
        required: false
  workflow_dispatch:
    inputs:
      model:
        description: Model name passed to tb2agent
        default: deepseek-v4-flash
      agent:
        description: Agent (oracle checks infrastructure without model tokens)
        type: choice
        options: [tinyagent_agent:TinyAgentAgent, oracle]
        default: tinyagent_agent:TinyAgentAgent
      preset:
        description: Task preset
        type: choice
        options: [smoke, coverage, hard]
        default: smoke
      include_task_name:
        description: Comma-separated task names or globs (smoke only)
        default: '*fix-git*,*git-leak-recovery*,*openssl-selfsigned-cert*'
      n_tasks:
        description: Maximum tasks (smoke only, 1-20)
        default: '3'
      max_iterations:
        description: Maximum agent iterations (smoke only, 1-256)
        default: '12'
      timeout_sec:
        description: Agent timeout per task (smoke only, 60-7200 seconds)
        default: '900'
      max_tokens:
        description: Output tokens per call (smoke only, 1-32768)
        default: '2048'
      trace_model:
        description: Include model responses in diagnostic logs
        type: boolean
        default: false
      minimum_reward:
        description: Minimum mean verifier reward (0-1; errors always fail)
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: tb2-${{ inputs.automatic && 'auto' || 'manual' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.automatic || false }}

jobs:
  tb2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.automatic && 45 || 250 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate and record benchmark configuration
        id: config
        env:
          TB2_AUTOMATIC: ${{ inputs.automatic || false }}
          TB2_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          TB2_AGENT: ${{ inputs.agent }}
          TB2_PRESET: ${{ inputs.preset }}
          TB2_TASKS: ${{ inputs.include_task_name }}
          TB2_N_TASKS: ${{ inputs.n_tasks }}
          TB2_MAX_ITERATIONS: ${{ inputs.max_iterations }}
          TB2_TIMEOUT_SEC: ${{ inputs.timeout_sec }}
          TB2_MAX_TOKENS: ${{ inputs.max_tokens }}
          TB2_TRACE_MODEL: ${{ inputs.trace_model || false }}
          TB2_MINIMUM_REWARD: ${{ inputs.minimum_reward }}
        run: python scripts/tb2_config.py --output tb2-config.json
      - name: Require model API key
        if: steps.config.outputs.agent != 'oracle'
        env:
          OPENAI_API_KEY: ${{ secrets.TINYAGENT_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Configure TINYAGENT_API_KEY for real-agent TB2 smoke; oracle does not validate TinyAgent.'
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build tb2agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o /tmp/tb2agent ./cmd/tb2agent
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Harbor and verify adapter
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r benchmark/harbor/requirements.txt
          .venv/bin/harbor --version
          PYTHONPATH=benchmark/harbor .venv/bin/python -c 'from tinyagent_agent import TinyAgentAgent; print(TinyAgentAgent.name())'
      - name: Run Terminal-Bench 2
        timeout-minutes: ${{ fromJSON(steps.config.outputs.run_timeout_minutes) }}
        env:
          OPENAI_API_KEY: ${{ steps.config.outputs.agent != 'oracle' && secrets.TINYAGENT_API_KEY || '' }}
          OPENAI_BASE_URL: ${{ steps.config.outputs.agent != 'oracle' && secrets.TINYAGENT_BASE_URL || '' }}
          OPENAI_MODEL: ${{ inputs.model || vars.TINYAGENT_MODEL || secrets.TINYAGENT_MODEL || 'deepseek-v4-flash' }}
          PYTHONPATH: ${{ github.workspace }}/benchmark/harbor
        run: .venv/bin/python scripts/tb2_run.py --config tb2-config.json --harbor .venv/bin/harbor
      - name: Check verifier results and publish summary
        if: always() && steps.config.outcome == 'success'
        run: python scripts/tb2_results.py --config tb2-config.json --results tb2-jobs --summary tb2-summary.md
      - name: Upload TB2 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tb2-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tb2-jobs/**
            tb2-config.json
            tb2-summary.md
          if-no-files-found: warn
          retention-days: 14
